name: Build e-Raport APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create signing key
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias eraport \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass eraport123 \
            -keypass eraport123 \
            -dname "CN=SMKS Mandiri, OU=ERaport, O=SMKS Mandiri, L=Bandar Agung, ST=Lampung, C=ID"

      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password=eraport123 \
            -Pandroid.injected.signing.key.alias=eraport \
            -Pandroid.injected.signing.key.password=eraport123

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            ERaport_SMKS_Mandiri_v1.0-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ERaport_SMKS_Mandiri_v1.0-release
          path: ERaport_SMKS_Mandiri_v1.0-release.apk
